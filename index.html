    <script>
        // 【1】作品データ
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyBxTn1qnki0affslZ4uI1T8-Jj6abuIinVn_AT_z2iFFE-U1Bx9VRRQvyb65wAW6Nz/exec';

        // Data will be fetched from GAS. Initialized as empty.
        let works = [];

        const infoData = {
            about: {
                title: "Saku",
                image: "cover art/sakumiku.jpg",
                description: "2002年生まれ。ボカロP/音楽プロデューサー/サウンドエンジニア。九州大学大学院芸術工学府修士課程在籍。初音ミクとエレクトロニカを軸に、楽曲提供、リミックス、ライブパフォーマンスなど幅広く活動する。現在の主なプロジェクトには、初音ミクの音素に注目したソロ名義「Kyototower」、4人のボカロPによるユニット「サタスコ」など。\n \n A Vocaloid producer, songwriter, and arranger born in 2002. Anchored in Hatsune Miku and electronica, the musical portfolio extends from client works and remixes to dynamic live performances. Currently spearheading two main projects: the experimental solo act \"Kyototower\", focusing on the raw vocal phonemes of Hatsune Miku, and the four-piece music collective \"satasuko\"."
            }
        };

        // 【2】変数の管理
        let currentActiveItem = null;
        let currentActiveTitle = null;

        // Undo / Redo History state management
        const historyStack = [];
        let historyIndex = -1;
        let isPerformingHistoryAction = false;

        function getCurrentState() {
            const activeCatEl = document.querySelector('.category-nav li.active');
            const activeCat = activeCatEl ? (activeCatEl.dataset.cat || 'all') : 'all';

            let viewType = 'list'; // 'list', 'work', 'info'
            let detailId = null;

            if (currentActiveTitle) {
                viewType = 'work';
                detailId = currentActiveTitle;
            } else {
                const activeSecondary = document.querySelector('.secondary-nav li.active');
                if (activeSecondary && activeSecondary.id === 'nav-about') {
                    viewType = 'info';
                    detailId = 'about';
                }
            }

            return {
                category: activeCat,
                viewType: viewType,
                detailId: detailId
            };
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('mobile-undo-btn');
            const redoBtn = document.getElementById('mobile-redo-btn');
            if (undoBtn) undoBtn.disabled = historyIndex <= 0;
            if (redoBtn) redoBtn.disabled = historyIndex >= historyStack.length - 1;
        }

        function pushState() {
            if (isPerformingHistoryAction) return;
            const newState = getCurrentState();

            // Avoid duplicate contiguous states
            if (historyIndex >= 0) {
                const curState = historyStack[historyIndex];
                if (curState.category === newState.category &&
                    curState.viewType === newState.viewType &&
                    curState.detailId === newState.detailId) {
                    return;
                }
            }

            // Truncate future history if we were in the middle of history
            historyStack.splice(historyIndex + 1);
            historyStack.push(newState);
            historyIndex = historyStack.length - 1;
            updateUndoRedoButtons();
        }

        function applyState(state) {
            isPerformingHistoryAction = true;
            try {
                // 1. Apply category filter if changed or needed
                const activeCatEl = document.querySelector('.category-nav li.active');
                const curCat = activeCatEl ? (activeCatEl.dataset.cat || 'all') : 'all';
                if (curCat !== state.category) {
                    const targetCatLi = document.querySelector(`.category-nav li[data-cat="${state.category}"]`);
                    filterWorksInternal(state.category, targetCatLi);
                }

                // 2. Apply view state
                if (state.viewType === 'list') {
                    resetViewInternal();
                } else if (state.viewType === 'work') {
                    const workObj = works.find(w => w.title === state.detailId);
                    if (workObj) {
                        const allItems = Array.from(workList.children);
                        const targetItem = allItems.find(el => el.innerText === workObj.title);
                        selectWorkInternal(targetItem, workObj);
                    } else {
                        resetViewInternal();
                    }
                } else if (state.viewType === 'info') {
                    const targetNav = document.getElementById(`nav-${state.detailId}`);
                    if (targetNav) {
                        showInfoPageInternal(state.detailId, targetNav);
                    } else {
                        resetViewInternal();
                    }
                }
            } finally {
                isPerformingHistoryAction = false;
                updateUndoRedoButtons();
            }
        }

        function undoState() {
            if (historyIndex > 0) {
                historyIndex--;
                applyState(historyStack[historyIndex]);
            }
        }

        function redoState() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                applyState(historyStack[historyIndex]);
            }
        }

        const workList = document.getElementById('work-list');
        const previewImg = document.getElementById('preview-image');
        const previewContainer = document.getElementById('preview-container');
        const detailArea = document.getElementById('detail-area');
        const detailTitle = document.getElementById('detail-title');
        const detailDesc = document.getElementById('detail-description');
        const detailLink = document.getElementById('detail-link');
        const detailTags = document.getElementById('detail-tags');
        const mediaContainer = document.getElementById('youtube-embed');
        const detailCredits = document.getElementById('detail-credits');
        const detailExtraImages = document.getElementById('detail-extra-images');

        // Helper: Preload images
        function preloadImages(works) {
            console.log('Preloading images...');
            works.forEach(work => {
                if (work.image) {
                    const img = new Image();
                    img.src = work.image;
                }
            });
            // Preload info images
            Object.values(infoData).forEach(info => {
                if (info.image) {
                    const img = new Image();
                    img.src = info.image;
                }
            });
        }

        // 【3】表示関数
        function displayWorks(filter) {
            workList.innerHTML = '';
            const filtered = filter === 'all' ? works : works.filter(w => {
                if (Array.isArray(w.category)) {
                    return w.category.includes(filter);
                }
                return w.category === filter;
            });

            filtered.forEach(work => {
                const item = document.createElement('div');
                item.className = 'work-item';
                item.innerText = work.title;

                // 未来の予定判定
                if (work['release date']) {
                    const dateStr = work['release date'].toString().replace(/\./g, '/');
                    const releaseDate = new Date(dateStr);
                    // 本日より未来の予定かチェック
                    // 比較を簡単にするため、今日の0時0分を取得
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    if (!isNaN(releaseDate) && releaseDate > today) {
                        item.classList.add('future-schedule');
                        work.isFuture = true;
                    }
                }

                // Restore persistent state
                if (currentActiveTitle) {
                    if (work.title === currentActiveTitle) {
                        item.classList.add('active');
                        currentActiveItem = item; // Re-bind the element reference
                    } else {
                        item.classList.add('is-disabled');
                    }
                }

                item.onmouseenter = () => {
                    if (currentActiveItem) return;
                    previewImg.style.display = 'block';
                    detailArea.style.display = 'none';
                    previewImg.src = work.image;
                    previewContainer.style.opacity = '1';

                    // Clear about/secondary nav active state when hovering works
                    document.querySelectorAll('.secondary-nav li').forEach(li => li.classList.remove('active'));

                    // Draw connection line if selected category is not 'all'
                    drawConnectionLines(item);
                };

                item.onmouseleave = () => {
                    if (currentActiveItem) return;
                    previewContainer.style.opacity = '0';
                    clearConnectionLines();
                };

                item.onclick = () => {
                    if (currentActiveItem === item || (currentActiveTitle && currentActiveTitle === work.title)) {
                        resetView();
                    } else {
                        selectWork(item, work);
                    }
                };
                workList.appendChild(item);
            });
        }

        // 【4】選択（ロック）状態にする関数
        function selectWorkInternal(element, data) {
            currentActiveItem = element;
            currentActiveTitle = data ? data.title : null;
            // Lock center column scrolling
            document.querySelector('.column.center').style.overflowY = 'hidden';

            // SNS highlights
            const snsYoutube = document.querySelector('.sns-youtube');
            const snsSoundcloud = document.querySelector('.sns-soundcloud');
            const snsBandcamp = document.querySelector('.sns-bandcamp');
            if (snsYoutube) snsYoutube.classList.remove('highlight-youtube');
            if (snsSoundcloud) snsSoundcloud.classList.remove('highlight-soundcloud');
            if (snsBandcamp) snsBandcamp.classList.remove('highlight-bandcamp');

            if (!data) return;

            const hasYoutube = !!data.youtubeId;
            const hasSoundcloud = !!data.soundcloudUrl;
            const hasBandcamp = !!data.bandcampUrl || (data.link && data.link.includes('bandcamp.com'));

            if (hasYoutube && snsYoutube) {
                snsYoutube.classList.add('highlight-youtube');
            }
            if (hasSoundcloud && snsSoundcloud) {
                snsSoundcloud.classList.add('highlight-soundcloud');
            }
            if (hasBandcamp && snsBandcamp) {
                snsBandcamp.classList.add('highlight-bandcamp');
            }

            // Mobile: Add class to body to switch views
            document.body.classList.add('mobile-detail-open');

            // 1. Toggle visibility (Transparency) FIRST to ensure UI feedback
            const allItems = Array.from(workList.children);
            allItems.forEach(el => {
                if (el === element) {
                    el.classList.add('active');
                    el.classList.remove('is-disabled');
                } else {
                    el.classList.remove('active');
                    el.classList.add('is-disabled');
                }
            });

            // 2. Remove active from about/secondary nav
            document.querySelectorAll('.secondary-nav li').forEach(li => li.classList.remove('active'));

            // 3. Clear 'related' class from all categories
            document.querySelectorAll('.category-nav li').forEach(li => li.classList.remove('related'));

            // 4. Highlight related categories
            try {
                if (data.category) {
                    const cats = Array.isArray(data.category) ? data.category : [data.category];
                    cats.forEach(c => {
                        if (typeof c === 'string') {
                            const text = c.trim();

                            document.querySelectorAll('.category-nav li').forEach(li => {
                                if (li.dataset.cat === text) {
                                    if (!li.classList.contains('active')) {
                                        li.classList.add('related');
                                    }
                                }
                            });
                        }
                    });
                }
            } catch (e) {
                console.error('Highlight error', e);
            }

            // Draw connection lines between genre tags and selected work item
            drawConnectionLines(element);

            // 5. Update Detail View
            previewImg.style.display = 'none';
            detailArea.style.display = 'block';
            previewContainer.style.opacity = '1';

            detailTitle.innerText = data.title;

            // メディア表示
            mediaContainer.innerHTML = '';
            if (data.youtubeId) {
                mediaContainer.innerHTML = `<iframe width="100%" height="250" src="https://www.youtube.com/embed/${data.youtubeId}" frameborder="0" allowfullscreen></iframe>`;
            } else if (data.soundcloudUrl) {
                const scUrl = encodeURIComponent(data.soundcloudUrl);
                mediaContainer.innerHTML = `<iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=${scUrl}&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>`;
            }

            detailDesc.innerText = data.description || '';

            // Handle Link
            detailLink.innerHTML = '';
            if (data.link) {
                const linkTitle = data['link title'] || data.link;
                const linkEl = document.createElement('a');
                linkEl.href = data.link;
                linkEl.target = "_blank";
                linkEl.innerText = linkTitle;
                detailLink.appendChild(linkEl);
                detailLink.style.display = 'block';
            } else {
                detailLink.style.display = 'none';
            }

            // Handle Tags (Between link and release date, clickable, styled with text underline, no # or commas)
            detailTags.innerHTML = '';
            if (data.category) {
                const cats = Array.isArray(data.category) ? data.category : [data.category];
                detailTags.style.display = 'flex';
                detailTags.style.flexWrap = 'wrap';
                detailTags.style.gap = '8px';
                detailTags.style.marginBottom = '1rem';
                detailTags.style.fontSize = '0.8rem';
                detailTags.style.color = '#666';

                const labelSpan = document.createElement('span');
                labelSpan.innerText = 'tag :';
                detailTags.appendChild(labelSpan);

                const navCatElements = Array.from(document.querySelectorAll('.category-nav li'));
                const navOrderMap = new Map();
                navCatElements.forEach((el, index) => {
                    if (el.dataset.cat) navOrderMap.set(el.dataset.cat, index);
                });

                cats.sort((a, b) => {
                    const indexA = navOrderMap.has(a.trim()) ? navOrderMap.get(a.trim()) : 999;
                    const indexB = navOrderMap.has(b.trim()) ? navOrderMap.get(b.trim()) : 999;
                    return indexA - indexB;
                });

                cats.forEach(c => {
                    const cleanTag = c.trim();
                    const targetLi = document.querySelector(`.category-nav li[data-cat="${cleanTag}"]`);
                    const displayText = targetLi ? targetLi.innerText.trim() : cleanTag;

                    const span = document.createElement('span');
                    span.innerText = displayText;
                    span.style.textDecoration = 'underline';
                    span.style.cursor = 'pointer';
                    span.onclick = () => {
                        filterWorks(cleanTag, targetLi);
                    };
                    detailTags.appendChild(span);
                });
            } else {
                detailTags.style.display = 'none';
            }

            detailCredits.innerHTML = '';
            if (data['release date'] || data.credits) {
                if (data['release date']) {
                    const dateDiv = document.createElement('div');
                    dateDiv.innerText = data['release date'];
                    if (data.isFuture) {
                        dateDiv.classList.add('future-schedule-text');
                    }
                    if (data.credits) {
                        dateDiv.style.marginBottom = '0.4rem';
                    }
                    detailCredits.appendChild(dateDiv);
                }

                if (data.credits) {
                    const creditDiv = document.createElement('div');
                    creditDiv.innerText = data.credits;
                    detailCredits.appendChild(creditDiv);
                }
                detailCredits.style.display = 'block';
            } else {
                detailCredits.style.display = 'none';
            }

            detailExtraImages.innerHTML = '';
            if (data.extraImages && data.extraImages.length > 0) {
                data.extraImages.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.style.width = '100%';
                    img.style.marginBottom = '1rem';
                    detailExtraImages.appendChild(img);
                });
            }
        }

        function selectWork(element, data) {
            selectWorkInternal(element, data);
            pushState();
        }

        // Connection Lines Drawing Helper
        function clearConnectionLines() {
            const svg = document.getElementById('connection-lines');
            if (svg) svg.innerHTML = '';
        }

        function drawConnectionLines(activeWorkItem) {
            clearConnectionLines();
            if (!activeWorkItem) return;

            if (window.innerWidth <= 768) return;

            const svg = document.getElementById('connection-lines');
            if (!svg) return;

            const workRect = activeWorkItem.getBoundingClientRect();
            const padding = 12;

            const targetX = workRect.left - padding;
            const targetY = workRect.top + (workRect.height / 2);

            const activeLi = document.querySelector('.category-nav li.active');
            if (activeLi && activeLi.id !== 'cat-all') {
                const span = activeLi.querySelector('span') || activeLi;
                const rect = span.getBoundingClientRect();

                const textRightX = rect.right;
                const textRightY = rect.top + (rect.height / 2);

                const aimX = textRightX + 10;
                const aimY = textRightY;

                const dx = targetX - aimX;
                const dy = targetY - aimY;
                const len = Math.hypot(dx, dy);

                if (len > 0) {
                    const x1 = textRightX + (dx / len) * padding;
                    const y1 = textRightY + (dy / len) * padding;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1);
                    line.setAttribute('y1', y1);
                    line.setAttribute('x2', targetX);
                    line.setAttribute('y2', targetY);
                    line.setAttribute('stroke', '#000000');
                    line.setAttribute('stroke-width', '1');
                    line.setAttribute('stroke-opacity', '0.17');
                    svg.appendChild(line);
                }
            }

            const relatedLis = document.querySelectorAll('.category-nav li.related');
            relatedLis.forEach(li => {
                if (li.id === 'cat-all') return;
                const span = li.querySelector('span') || li;
                const rect = span.getBoundingClientRect();

                const textRightX = rect.right;
                const textRightY = rect.top + (rect.height / 2);

                const aimX = textRightX + 10;
                const aimY = textRightY;

                const dx = targetX - aimX;
                const dy = targetY - aimY;
                const len = Math.hypot(dx, dy);

                if (len > 0) {
                    const x1 = textRightX + (dx / len) * padding;
                    const y1 = textRightY + (dy / len) * padding;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1);
                    line.setAttribute('y1', y1);
                    line.setAttribute('x2', targetX);
                    line.setAttribute('y2', targetY);
                    line.setAttribute('stroke', '#4747ff');
                    line.setAttribute('stroke-width', '1');
                    line.setAttribute('stroke-opacity', '0.25');
                    svg.appendChild(line);
                }
            });
        }

        function showInfoPageInternal(type, element) {
            clearConnectionLines();
            if (currentActiveItem) {
                currentActiveItem = null;
                document.querySelectorAll('.work-item').forEach(el => {
                    el.classList.remove('active', 'is-disabled');
                });
            }

            const snsYoutube = document.querySelector('.sns-youtube');
            const snsSoundcloud = document.querySelector('.sns-soundcloud');
            const snsBandcamp = document.querySelector('.sns-bandcamp');
            if (snsYoutube) snsYoutube.classList.remove('highlight-youtube');
            if (snsSoundcloud) snsSoundcloud.classList.remove('highlight-soundcloud');
            if (snsBandcamp) snsBandcamp.classList.remove('highlight-bandcamp');

            document.querySelector('.column.center').style.overflowY = 'auto';
            document.body.classList.add('mobile-detail-open');

            document.querySelectorAll('.secondary-nav li').forEach(li => li.classList.remove('active'));
            document.querySelectorAll('.category-nav li').forEach(li => li.classList.remove('related'));

            element.classList.add('active');

            previewImg.style.display = 'none';
            detailArea.style.display = 'block';
            previewContainer.style.opacity = '1';

            const data = infoData[type];
            detailTitle.innerText = data.title;
            detailDesc.innerText = data.description;

            if (data.image) {
                previewImg.src = data.image;
                previewImg.style.display = 'block';
            }

            mediaContainer.innerHTML = '';
            detailLink.innerHTML = '';
            detailLink.style.display = 'none';
            detailTags.innerHTML = '';
            detailTags.style.display = 'none';
            detailCredits.innerText = '';
            detailCredits.style.display = 'none';
            detailExtraImages.innerHTML = '';
        }

        function showInfoPage(type, element) {
            showInfoPageInternal(type, element);
            pushState();
        }

        function resetViewInternal() {
            clearConnectionLines();
            document.querySelector('.column.center').style.overflowY = 'auto';
            document.body.classList.remove('mobile-detail-open');

            currentActiveItem = null;
            currentActiveTitle = null;
            detailArea.style.display = 'none';
            previewContainer.style.opacity = '0';
            mediaContainer.innerHTML = '';
            detailTags.innerHTML = '';
            detailTags.style.display = 'none';
            detailExtraImages.innerHTML = '';
            document.querySelectorAll('.work-item').forEach(el => {
                el.classList.remove('active', 'is-disabled');
            });
            document.querySelectorAll('.category-nav li').forEach(li => li.classList.remove('related'));
            document.querySelectorAll('.secondary-nav li').forEach(li => li.classList.remove('active'));

            const snsYoutube = document.querySelector('.sns-youtube');
            const snsSoundcloud = document.querySelector('.sns-soundcloud');
            const snsBandcamp = document.querySelector('.sns-bandcamp');
            if (snsYoutube) snsYoutube.classList.remove('highlight-youtube');
            if (snsSoundcloud) snsSoundcloud.classList.remove('highlight-soundcloud');
            if (snsBandcamp) snsBandcamp.classList.remove('highlight-bandcamp');
        }

        function resetView() {
            resetViewInternal();
            pushState();
        }

        function filterWorksInternal(cat, element) {
            const isAboutActive = document.querySelector('.secondary-nav li.active');

            if (!isAboutActive) {
                resetViewInternal();
            } else {
                currentActiveItem = null;
                currentActiveTitle = null;
                document.querySelectorAll('.category-nav li').forEach(li => li.classList.remove('related'));
            }

            document.querySelectorAll('.category-nav li').forEach(li => {
                li.classList.remove('active');
            });

            if (element) {
                element.classList.add('active');
            } else {
                const allCat = document.getElementById('cat-all');
                if (allCat) allCat.classList.add('active');
            }
            displayWorks(cat);
        }

        function filterWorks(cat, element) {
            if (element && element.classList.contains('active') && cat !== 'all') {
                const allCatBtn = document.getElementById('cat-all');
                filterWorks('all', allCatBtn);
                return;
            }

            filterWorksInternal(cat, element);
            pushState();
        }

        function onLogoClick() {
            // 1. Set filter to 'all'
            // We can reuse filterWorks('all', element) but we need to pass the 'all' element to update UI state
            const allCatBtn = document.getElementById('cat-all');
            filterWorks('all', allCatBtn);

            // 2. Show 'about' page
            const aboutBtn = document.getElementById('nav-about');
            if (aboutBtn) {
                showInfoPage('about', aboutBtn);
            }
        }

        // 初期起動
        displayWorks('all');
        pushState();

        // Fetch Data from GAS
        async function fetchWorks() {
            // 1. Try to load from cache first
            const cached = localStorage.getItem('works_cache');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        console.log('Loaded from cache');
                        works = parsed;
                        const activeCat = document.querySelector('.category-nav li.active');
                        const filter = activeCat ? (activeCat.dataset.cat || 'all') : 'all';
                        displayWorks(filter);
                        // Start preloading (deferred slightly or immediate)
                        setTimeout(() => preloadImages(works), 100);
                    }
                } catch (e) {
                    console.error('Cache parse error', e);
                }
            }

            if (!GAS_API_URL) return;

            // 2. Fetch fresh data
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    console.log('Loaded from Network');
                    // Filter out empty rows (where title is missing)
                    works = data.filter(w => w.title && w.title.trim() !== '');

                    // Save to cache
                    localStorage.setItem('works_cache', JSON.stringify(works));

                    // Re-apply current filter
                    const activeCat = document.querySelector('.category-nav li.active');
                    const filter = activeCat ? (activeCat.dataset.cat || 'all') : 'all';
                    displayWorks(filter);

                    // Start preloading
                    preloadImages(works);
                }
            } catch (error) {
                console.error('Failed to fetch works:', error);
            }
        }

        fetchWorks();

        // Scroll Synchronization
        const centerColumn = document.querySelector('.column.center');
        const leftColumn = document.querySelector('.column.left');
        const rightColumn = document.querySelector('.column.right');

        function syncScroll(e) {
            const isAboutActive = document.querySelector('.secondary-nav li.active');
            const isLeft = e.currentTarget.classList.contains('left');

            // 1. Work Item Selected (Center Locked)
            if (currentActiveItem) {
                e.preventDefault();
                rightColumn.scrollTop += e.deltaY;
            }
            // 2. About Section Active
            else if (isAboutActive) {
                // Only sync left column scroll to right
                if (isLeft) {
                    e.preventDefault();
                    rightColumn.scrollTop += e.deltaY;
                }
                // (Center column continues to scroll naturally)
            }
        }

        centerColumn.addEventListener('wheel', syncScroll, { passive: false });
        leftColumn.addEventListener('wheel', syncScroll, { passive: false });

        window.addEventListener('resize', () => {
            if (currentActiveItem) {
                drawConnectionLines(currentActiveItem);
            }
        });

        centerColumn.addEventListener('scroll', () => {
            if (currentActiveItem) {
                drawConnectionLines(currentActiveItem);
            }
        });
        leftColumn.addEventListener('scroll', () => {
            if (currentActiveItem) {
                drawConnectionLines(currentActiveItem);
            }
        });
    </script>
</body>

</html>
